<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张量积 Bézier 曲面</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background: #10151c; color: #eaf0f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    #app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 100vh; }
    #viewport { position: relative; min-height: 620px; overflow: hidden; background: radial-gradient(circle at 45% 35%, #273a4a, #10151c 62%); }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; top: 18px; left: 18px; padding: 10px 12px; border: 1px solid #4b6275; border-radius: 8px; background: #12202bdd; color: #cddbe6; font-size: 13px; line-height: 1.65; pointer-events: none; }
    aside { padding: 22px; border-left: 1px solid #314352; background: #17212b; overflow: auto; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    h2 { margin: 22px 0 10px; font-size: 15px; color: #a9c6dc; }
    p { margin: 0; color: #b8c5cf; font-size: 13px; line-height: 1.6; }
    .field { display: grid; gap: 6px; margin: 12px 0; color: #dce8f2; font-size: 13px; }
    .field-head { display: flex; justify-content: space-between; }
    output { color: #7bdcff; font-variant-numeric: tabular-nums; }
    input, select, button { width: 100%; font: inherit; }
    input[type="range"] { accent-color: #54c5ef; }
    select, button { min-height: 34px; border: 1px solid #40596b; border-radius: 6px; background: #223442; color: #eaf0f6; padding: 6px 8px; }
    button { cursor: pointer; background: #1d778f; border-color: #4dd0e8; font-weight: 600; }
    button:hover { background: #2695ae; }
    .value { padding: 10px; border-left: 3px solid #f4c95d; background: #1c2d39; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; line-height: 1.65; }
    .selected-control { margin-top: -4px; color: #ffe486; font-size: 12px; }
    code { color: #83e0ff; }
    .legend { display: grid; gap: 7px; margin-top: 12px; font-size: 12px; color: #b8c5cf; }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; vertical-align: -1px; }
    @media (max-width: 800px) { #app { grid-template-columns: 1fr; } #viewport { min-height: 60vh; } aside { border-top: 1px solid #314352; border-left: 0; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <section id="viewport" aria-label="张量积 Bézier 曲面三维视图">
      <div class="hud">鼠标左键旋转 · 滚轮缩放 · 右键平移<br />红点是控制点，黄色点是当前 <i>S(u,v)</i></div>
      <canvas id="surface-canvas"></canvas>
    </section>
    <aside>
      <h1>张量积 Bézier 曲面</h1>
      <p>这是一个双三次曲面片：<code>m = n = 3</code>，所以控制网有 <code>4 × 4 = 16</code> 个点。</p>

      <div class="field">
        <div class="field-head"><label for="u">u 参数</label><output id="u-out">0.50</output></div>
        <input id="u" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>
      <div class="field">
        <div class="field-head"><label for="v">v 参数</label><output id="v-out">0.50</output></div>
        <input id="v" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>

      <h2>当前曲面点</h2>
      <div class="value" id="sample-value">S(0.50, 0.50) = (...)</div>

      <h2>修改控制点</h2>
      <p>选择一个控制点，改变它的 Z 高度；曲面会立即重新按所有 Bernstein 权重计算。</p>
      <div class="field">
        <label for="control-select">控制点</label>
        <select id="control-select"></select>
        <div class="selected-control" id="selected-control">已高亮：P00</div>
      </div>
      <div class="field">
        <div class="field-head"><label for="z">Z 高度</label><output id="z-out">0.00</output></div>
        <input id="z" type="range" min="-3" max="3" step="0.01" value="0" />
      </div>
      <button id="reset" type="button">恢复示例控制网</button>

      <h2>本页实际计算的式子</h2>
      <p><code>S(u,v) = Σᵢ₌₀³ Σⱼ₌₀³ Bᵢ³(u) Bⱼ³(v) Pᵢⱼ</code></p>
      <div class="legend">
        <span><i class="dot" style="background:#ef6a67"></i>控制点与控制网</span>
        <span><i class="dot" style="background:#5bc0eb"></i>由全部 16 项加权得到的曲面</span>
        <span><i class="dot" style="background:#f4c95d"></i>当前参数对应的曲面点</span>
      </div>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const degree = 3;
    const resolution = 42;
    const canvas = document.querySelector('#surface-canvas');
    const viewport = document.querySelector('#viewport');
    const uInput = document.querySelector('#u');
    const vInput = document.querySelector('#v');
    const uOut = document.querySelector('#u-out');
    const vOut = document.querySelector('#v-out');
    const zInput = document.querySelector('#z');
    const zOut = document.querySelector('#z-out');
    const select = document.querySelector('#control-select');
    const selectedControlText = document.querySelector('#selected-control');
    const sampleValue = document.querySelector('#sample-value');

    const initialHeights = [
      [-0.25, 0.40, 0.90, 0.15],
      [-0.70, 0.65, 1.75, 0.35],
      [-0.35, 0.85, -0.30, 0.65],
      [0.25, 0.65, 0.35, -0.15],
    ];
    let heights = initialHeights.map(row => [...row]);
    const controls = Array.from({ length: 4 }, (_, i) =>
      Array.from({ length: 4 }, (_, j) => new THREE.Vector3((i - 1.5) * 2.1, (j - 1.5) * 2.1, heights[i][j]))
    );

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x10151c, 0);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(7.2, -8.2, 7.0);
    const orbit = new OrbitControls(camera, canvas);
    orbit.target.set(0, 0, 0.3);
    orbit.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xccecff, 0x17212b, 2.4));
    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(4, -3, 8);
    scene.add(light);
    const grid = new THREE.GridHelper(12, 12, 0x476170, 0x293d4b);
    scene.add(grid);
    const axes = new THREE.AxesHelper(2);
    axes.position.set(-4.2, -4.2, 0);
    scene.add(axes);

    const surfaceGeometry = new THREE.BufferGeometry();
    const vertices = new Float32Array((resolution + 1) * (resolution + 1) * 3);
    const indices = [];
    for (let i = 0; i < resolution; i++) {
      for (let j = 0; j < resolution; j++) {
        const a = i * (resolution + 1) + j;
        const b = a + resolution + 1;
        indices.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    surfaceGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    surfaceGeometry.setIndex(indices);
    const surface = new THREE.Mesh(surfaceGeometry, new THREE.MeshStandardMaterial({ color: 0x38bce3, roughness: 0.35, metalness: 0.05, side: THREE.DoubleSide, transparent: true, opacity: 0.76 }));
    scene.add(surface);
    let surfaceWire = new THREE.LineSegments(new THREE.WireframeGeometry(surfaceGeometry), new THREE.LineBasicMaterial({ color: 0xbbeeff, transparent: true, opacity: 0.42 }));
    scene.add(surfaceWire);

    const netGroup = new THREE.Group();
    scene.add(netGroup);
    const pointMeshes = [];
    const sphereGeometry = new THREE.SphereGeometry(0.115, 18, 12);
    const pointMaterial = new THREE.MeshStandardMaterial({ color: 0xef6a67, roughness: 0.38 });
    for (let i = 0; i <= degree; i++) {
      for (let j = 0; j <= degree; j++) {
        const point = new THREE.Mesh(sphereGeometry, pointMaterial);
        point.position.copy(controls[i][j]);
        netGroup.add(point);
        pointMeshes.push(point);
      }
    }

    // 黄色线框始终套住当前下拉框选中的控制点，避免在密集控制网中迷失目标。
    const selectedHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.225, 18, 12),
      new THREE.MeshBasicMaterial({ color: 0xffe36d, wireframe: true, transparent: true, opacity: 0.95 })
    );
    selectedHalo.renderOrder = 2;
    scene.add(selectedHalo);
    const netLines = [];
    for (let k = 0; k <= degree; k++) {
      const geometry = new THREE.BufferGeometry();
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xef6a67 }));
      netGroup.add(line);
      netLines.push(line);
    }
    for (let k = 0; k <= degree; k++) {
      const geometry = new THREE.BufferGeometry();
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xef6a67 }));
      netGroup.add(line);
      netLines.push(line);
    }

    const sample = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14), new THREE.MeshStandardMaterial({ color: 0xf4c95d, emissive: 0x5b4510, emissiveIntensity: 0.7 }));
    scene.add(sample);

    function binomial(n, k) {
      let value = 1;
      for (let r = 1; r <= k; r++) value = value * (n - k + r) / r;
      return value;
    }
    function bernstein(n, i, t) {
      return binomial(n, i) * t ** i * (1 - t) ** (n - i);
    }
    function evaluate(u, v) {
      const result = new THREE.Vector3();
      for (let i = 0; i <= degree; i++) {
        for (let j = 0; j <= degree; j++) {
          result.addScaledVector(controls[i][j], bernstein(degree, i, u) * bernstein(degree, j, v));
        }
      }
      return result;
    }
    function updateNet() {
      let meshIndex = 0;
      for (let i = 0; i <= degree; i++) {
        for (let j = 0; j <= degree; j++) pointMeshes[meshIndex++].position.copy(controls[i][j]);
      }
      for (let i = 0; i <= degree; i++) netLines[i].geometry.setFromPoints(controls[i]);
      for (let j = 0; j <= degree; j++) netLines[degree + 1 + j].geometry.setFromPoints(controls.map(row => row[j]));
      updateSelectionHighlight();
    }
    function updateSurface() {
      let offset = 0;
      for (let i = 0; i <= resolution; i++) {
        for (let j = 0; j <= resolution; j++) {
          const point = evaluate(i / resolution, j / resolution);
          vertices[offset++] = point.x;
          vertices[offset++] = point.y;
          vertices[offset++] = point.z;
        }
      }
      surfaceGeometry.attributes.position.needsUpdate = true;
      surfaceGeometry.computeVertexNormals();
      surfaceGeometry.computeBoundingSphere();
      const replacement = new THREE.WireframeGeometry(surfaceGeometry);
      surfaceWire.geometry.dispose();
      surfaceWire.geometry = replacement;
      updateSample();
    }
    function updateSample() {
      const u = Number(uInput.value), v = Number(vInput.value);
      const point = evaluate(u, v);
      sample.position.copy(point);
      uOut.value = u.toFixed(2);
      vOut.value = v.toFixed(2);
      sampleValue.textContent = `S(${u.toFixed(2)}, ${v.toFixed(2)}) = (${point.x.toFixed(2)}, ${point.y.toFixed(2)}, ${point.z.toFixed(2)})`;
    }
    function selectedIndex() { return select.value.split(',').map(Number); }
    function updateSelectionHighlight() {
      const [i, j] = selectedIndex();
      const highlightedIndex = i * (degree + 1) + j;
      pointMeshes.forEach((point, index) => point.scale.setScalar(index === highlightedIndex ? 1.42 : 1));
      selectedHalo.position.copy(controls[i][j]);
      selectedControlText.textContent = `已高亮：P${i}${j}（黄色线框球）`;
    }
    function syncSelectedControl() {
      const [i, j] = selectedIndex();
      zInput.value = controls[i][j].z;
      zOut.value = controls[i][j].z.toFixed(2);
      updateSelectionHighlight();
    }
    function syncHeightsToControls() {
      for (let i = 0; i <= degree; i++) for (let j = 0; j <= degree; j++) controls[i][j].z = heights[i][j];
    }
    for (let i = 0; i <= degree; i++) {
      for (let j = 0; j <= degree; j++) {
        const option = document.createElement('option');
        option.value = `${i},${j}`;
        option.textContent = `P${i}${j}`;
        select.append(option);
      }
    }
    uInput.addEventListener('input', updateSample);
    vInput.addEventListener('input', updateSample);
    select.addEventListener('change', syncSelectedControl);
    zInput.addEventListener('input', () => {
      const [i, j] = selectedIndex();
      controls[i][j].z = Number(zInput.value);
      heights[i][j] = controls[i][j].z;
      zOut.value = controls[i][j].z.toFixed(2);
      updateNet();
      updateSurface();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      heights = initialHeights.map(row => [...row]);
      syncHeightsToControls();
      updateNet();
      updateSurface();
      syncSelectedControl();
    });

    function resize() {
      const { width, height } = viewport.getBoundingClientRect();
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(viewport);
    function animate() {
      orbit.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    updateNet();
    updateSurface();
    syncSelectedControl();
    resize();
    animate();
  </script>
</body>
</html>
